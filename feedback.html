
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Feedback</title>
</head>

<body>

    <header>
        <h1>Student Feedback</h1>

        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="profile.html">Profile</a></li>
                <li><a href="courses.html">Courses</a></li>
                <li><a href="feedback.html">Feedback</a></li>
                <li><a href="grades.html">Grades</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Feedback Form</h2>

        <form action="#" method="post">

            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" required>
            <br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <br><br>

            <p>How do you rate this portal?</p>

            <input type="radio" id="good" name="rating" value="Good">
            <label for="good">Good</label>

            <input type="radio" id="average" name="rating" value="Average">
            <label for="average">Average</label>

            <input type="radio" id="poor" name="rating" value="Poor">
            <label for="poor">Poor</label>
            <br><br>

            <label for="features">What do you like?</label>
            <br>

            <input type="checkbox" id="design" name="features" value="Design">
            <label for="design">Design</label>

            <input type="checkbox" id="courses" name="features" value="Courses">
            <label for="courses">Courses</label>
            <br><br>

            <label for="course">Select your course:</label>
            <select id="course" name="course">
                <option value="">Choose a course</option>
                <option value="HTML">HTML</option>
                <option value="CSS">CSS</option>
                <option value="JavaScript">JavaScript</option>
                <option value="C Programming">C Programming</option>
            </select>
            <br><br>

            <label for="message">Your Feedback:</label>
            <br>
            <textarea id="message" name="message" rows="5" cols="30"
                placeholder="Write your feedback here"></textarea>
            <br><br>

            <button type="submit">Submit Feedback</button>

        </form>
    </main>

    <footer>
        <p>© 2026 Student Portal. All rights reserved.</p>
    </footer>

</body>
</html>
